# Dev compose for Alethea.
# - postgres + redis are added now so Phase 1/2 can wire against them immediately
# - api, web, scraper are the live services
# - no Caddy in dev (browser hits ports directly); Caddy lands in docker-compose.prod.yml
# Usage:  make dev   (or:  docker compose -f infra/docker-compose.dev.yml --env-file .env up --build)

name: alethea

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alethea}
      POSTGRES_USER: ${POSTGRES_USER:-alethea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alethea_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alethea} -d ${POSTGRES_DB:-alethea}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  scraper-instagram:
    build:
      context: ../services/scrapers/instagram
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5001
    ports:
      - "${SCRAPER_PORT:-5001}:5001"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 8080
      INSTAGRAM_SERVICE_URL: http://scraper-instagram:5001
      DATABASE_URL: postgres://${POSTGRES_USER:-alethea}:${POSTGRES_PASSWORD:-alethea_dev_change_me}@postgres:5432/${POSTGRES_DB:-alethea}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper-instagram:
        condition: service_started
    volumes:
      - ../apps/api:/src

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data: {}
  redis-data: {}
